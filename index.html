<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Tic-Tac-Toe</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #08081a; font-family: 'Segoe UI', sans-serif; overflow: hidden; }
  #canvas { display: block; }
  #ui {
    position: fixed; top: 0; left: 0; right: 0;
    display: flex; flex-direction: column; align-items: center;
    pointer-events: none;
    padding-top: 16px;
  }
  h1 {
    font-size: 1.6rem; letter-spacing: 5px; font-weight: 300;
    background: linear-gradient(135deg, #00f0ff, #a855f7);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    margin-bottom: 6px;
  }
  #status {
    font-size: 1rem; color: #aaa; letter-spacing: 2px;
    min-height: 1.4rem; text-align: center;
  }
  .x-col { color: #00f0ff; font-weight: bold; }
  .o-col { color: #f97316; font-weight: bold; }
  .w-col { color: #a855f7; font-weight: bold; font-size: 1.2rem; }
  #bottom {
    position: fixed; bottom: 24px; left: 0; right: 0;
    display: flex; flex-direction: column; align-items: center; gap: 10px;
    pointer-events: none;
  }
  #score { color: rgba(255,255,255,0.35); font-size: 0.8rem; letter-spacing: 2px; }
  #score span { color: rgba(255,255,255,0.65); }
  button {
    pointer-events: all;
    padding: 0.55rem 2rem;
    border: 1px solid rgba(168,85,247,0.5);
    background: rgba(168,85,247,0.12);
    color: #a855f7; border-radius: 6px;
    font-size: 0.85rem; letter-spacing: 2px; cursor: pointer;
    transition: all 0.2s;
  }
  button:hover { background: rgba(168,85,247,0.28); box-shadow: 0 0 18px rgba(168,85,247,0.4); }
  .hint { color: rgba(255,255,255,0.18); font-size: 0.68rem; letter-spacing: 1px; }
  #layer-info {
    position: fixed; right: 20px; top: 50%; transform: translateY(-50%);
    display: flex; flex-direction: column; gap: 8px; pointer-events: none;
  }
  .layer-dot {
    width: 10px; height: 10px; border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.2);
    background: rgba(255,255,255,0.05);
  }
  .layer-dot.active { background: rgba(168,85,247,0.6); border-color: #a855f7; }
</style>
</head>
<body>
<canvas id="canvas"></canvas>

<div id="ui">
  <h1>3D TIC-TAC-TOE</h1>
  <div id="status"></div>
</div>

<div id="bottom">
  <button onclick="newGame()">NEW GAME</button>
  <div id="score">X: <span id="sX">0</span> &nbsp;|&nbsp; O: <span id="sO">0</span> &nbsp;|&nbsp; Draw: <span id="sD">0</span></div>
  <div class="hint">Drag to rotate · Click a cell to play · Scroll to zoom</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ── Scene Setup ──────────────────────────────────────────────────────────────
const W = window.innerWidth, H = window.innerHeight;
const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('canvas'), antialias: true, alpha: true });
renderer.setSize(W, H);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x08081a, 0.04);

const camera = new THREE.PerspectiveCamera(50, W / H, 0.1, 100);
camera.position.set(0, 5, 10);
camera.lookAt(0, 0, 0);

// Lighting
scene.add(new THREE.AmbientLight(0x334466, 1.5));
const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
dirLight.position.set(8, 12, 8);
dirLight.castShadow = true;
scene.add(dirLight);
const ptX = new THREE.PointLight(0x00f0ff, 2, 20); ptX.position.set(-5, 3, 3); scene.add(ptX);
const ptO = new THREE.PointLight(0xf97316, 2, 20); ptO.position.set( 5, 3, 3); scene.add(ptO);
const ptW = new THREE.PointLight(0xa855f7, 0, 20); ptW.position.set( 0, 5, 0); scene.add(ptW);

// ── Game State ───────────────────────────────────────────────────────────────
let board = Array(27).fill(null);
let currentPlayer = 'X';
let gameOver = false;
let scores = { X: 0, O: 0, draw: 0 };
let cellMeshes = [];
let winMeshes = [];
let pivot = new THREE.Group();
scene.add(pivot);

const WINS = (() => {
  const lines = [], idx = (x,y,z) => z*9 + y*3 + x;
  for(let a=0;a<3;a++) for(let b=0;b<3;b++) {
    lines.push([idx(0,a,b),idx(1,a,b),idx(2,a,b)]);
    lines.push([idx(a,0,b),idx(a,1,b),idx(a,2,b)]);
    lines.push([idx(a,b,0),idx(a,b,1),idx(a,b,2)]);
  }
  for(let z=0;z<3;z++) {
    lines.push([idx(0,0,z),idx(1,1,z),idx(2,2,z)]);
    lines.push([idx(2,0,z),idx(1,1,z),idx(0,2,z)]);
  }
  for(let x=0;x<3;x++) {
    lines.push([idx(x,0,0),idx(x,1,1),idx(x,2,2)]);
    lines.push([idx(x,2,0),idx(x,1,1),idx(x,0,2)]);
  }
  for(let y=0;y<3;y++) {
    lines.push([idx(0,y,0),idx(1,y,1),idx(2,y,2)]);
    lines.push([idx(2,y,0),idx(1,y,1),idx(0,y,2)]);
  }
  lines.push([idx(0,0,0),idx(1,1,1),idx(2,2,2)]);
  lines.push([idx(2,0,0),idx(1,1,1),idx(0,2,2)]);
  lines.push([idx(0,2,0),idx(1,1,1),idx(2,0,2)]);
  lines.push([idx(2,2,0),idx(1,1,1),idx(0,0,2)]);
  return lines;
})();

// Materials
const matEmpty = new THREE.MeshPhongMaterial({
  color: 0x1a1a3a, transparent: true, opacity: 0.55,
  shininess: 80, specular: 0x4444aa
});
const matHover = new THREE.MeshPhongMaterial({
  color: 0x2a1a4a, transparent: true, opacity: 0.75,
  shininess: 120, specular: 0x8855cc, emissive: 0x110022
});
const matX = new THREE.MeshPhongMaterial({
  color: 0x00c8e0, emissive: 0x003344, shininess: 150, specular: 0x00ffff
});
const matO = new THREE.MeshPhongMaterial({
  color: 0xe06010, emissive: 0x331100, shininess: 150, specular: 0xff8844
});
const matWin = new THREE.MeshPhongMaterial({
  color: 0xa855f7, emissive: 0x441166, shininess: 200, specular: 0xdd88ff
});
const edgeMat = new THREE.LineBasicMaterial({ color: 0x334488, transparent: true, opacity: 0.4 });

function makeGridLines() {
  const grp = new THREE.Group();
  const s = 1.4, spacing = 1.6;
  const offsets = [-spacing, 0, spacing];

  // Grid lines per layer
  for(let z=0;z<3;z++) {
    const zv = offsets[z];
    for(let i=0;i<4;i++) {
      const v = -spacing - s/2 + i * spacing;
      // horizontal
      const hg = new THREE.BufferGeometry().setFromPoints([
        new THREE.Vector3(-spacing - s/2, v, zv),
        new THREE.Vector3( spacing + s/2, v, zv)
      ]);
      grp.add(new THREE.Line(hg, edgeMat));
      // vertical
      const vg = new THREE.BufferGeometry().setFromPoints([
        new THREE.Vector3(v, -spacing - s/2, zv),
        new THREE.Vector3(v,  spacing + s/2, zv)
      ]);
      grp.add(new THREE.Line(vg, edgeMat));
    }
    // layer box
    const hw = spacing + s/2;
    const corners = [
      [-hw,-hw,zv],[ hw,-hw,zv],[ hw, hw,zv],[-hw, hw,zv],[-hw,-hw,zv]
    ].map(p => new THREE.Vector3(...p));
    grp.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(corners), edgeMat));
  }
  // Vertical connectors between layers
  const corners2 = [[-1,0],[1,0],[0,-1],[0,1]];
  for(const [cx,cy] of corners2) {
    const px = (cx) * (spacing + s/2);
    const py = (cy) * (spacing + s/2);
    const pts = offsets.map(zv => new THREE.Vector3(px, py, zv));
    grp.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),
      new THREE.LineBasicMaterial({ color: 0x334488, transparent: true, opacity: 0.2 })));
  }
  pivot.add(grp);
}

function buildBoard() {
  // Clear existing
  cellMeshes.forEach(m => pivot.remove(m));
  cellMeshes = [];
  winMeshes.forEach(m => pivot.remove(m));
  winMeshes = [];

  const spacing = 1.6;
  const offsets = [-spacing, 0, spacing];
  const geo = new THREE.BoxGeometry(1.2, 1.2, 1.2, 1, 1, 1);
  const edgeGeo = new THREE.EdgesGeometry(geo);

  for(let z=0;z<3;z++) {
    for(let y=0;y<3;y++) {
      for(let x=0;x<3;x++) {
        const i = z*9 + y*3 + x;
        const mesh = new THREE.Mesh(geo, matEmpty.clone());
        mesh.position.set(offsets[x], offsets[y], offsets[z]);
        mesh.castShadow = true;
        mesh.receiveShadow = true;
        mesh.userData = { index: i, x, y, z };

        // Edge wireframe
        const edges = new THREE.LineSegments(edgeGeo,
          new THREE.LineBasicMaterial({ color: 0x5566bb, transparent: true, opacity: 0.5 }));
        mesh.add(edges);

        pivot.add(mesh);
        cellMeshes.push(mesh);
      }
    }
  }
}

function markCell(i, player) {
  const mesh = cellMeshes[i];
  const mat = player === 'X' ? matX.clone() : matO.clone();
  mesh.material = mat;
  mesh.userData.taken = true;
  mesh.userData.player = player;

  // Floating symbol inside
  const sym = player === 'X' ? makeX() : makeO();
  sym.scale.setScalar(0.5);
  mesh.add(sym);

  // Pop animation
  mesh.scale.setScalar(0.01);
  animatePop(mesh);
}

function makeX() {
  const g = new THREE.Group();
  const mat = new THREE.MeshPhongMaterial({ color: 0x00f0ff, emissive: 0x004455 });
  const bar = new THREE.CylinderGeometry(0.06, 0.06, 1.2, 8);
  const b1 = new THREE.Mesh(bar, mat); b1.rotation.z = Math.PI/4; g.add(b1);
  const b2 = new THREE.Mesh(bar, mat); b2.rotation.z = -Math.PI/4; g.add(b2);
  return g;
}

function makeO() {
  const g = new THREE.Group();
  const mat = new THREE.MeshPhongMaterial({ color: 0xf97316, emissive: 0x331100 });
  const tor = new THREE.TorusGeometry(0.38, 0.07, 12, 32);
  const t = new THREE.Mesh(tor, mat); t.rotation.x = Math.PI/2; g.add(t);
  return g;
}

let popQueue = [];
function animatePop(mesh) { popQueue.push({ mesh, t: 0 }); }

function highlightWin(line) {
  line.forEach(i => {
    cellMeshes[i].material = matWin.clone();
    winMeshes.push(cellMeshes[i]);
  });
  ptW.intensity = 3;
}

// ── Interaction ──────────────────────────────────────────────────────────────
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();
let hoveredCell = null;

function onMouseMove(e) {
  mouse.x = (e.clientX / W) * 2 - 1;
  mouse.y = -(e.clientY / H) * 2 + 1;
}

function onClick(e) {
  if(gameOver) return;
  mouse.x = (e.clientX / W) * 2 - 1;
  mouse.y = -(e.clientY / H) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);
  const hits = raycaster.intersectObjects(cellMeshes);
  if(!hits.length) return;
  const cell = hits[0].object;
  if(cell.userData.taken) return;
  const i = cell.userData.index;
  board[i] = currentPlayer;
  markCell(i, currentPlayer);

  const winner = checkWinner();
  if(winner) {
    highlightWin(winner.line);
    scores[winner.player]++;
    updateScore();
    setStatus(`<span class="w-col">🎉 Player ${winner.player} wins!</span>`);
    gameOver = true;
  } else if(board.every(v => v)) {
    scores.draw++;
    updateScore();
    setStatus(`<span class="w-col">It's a draw!</span>`);
    gameOver = true;
  } else {
    currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
    setStatus(`Player <span class="${currentPlayer==='X'?'x-col':'o-col'}">${currentPlayer}</span>'s turn`);
  }
}

function checkWinner() {
  for(const line of WINS) {
    const [a,b,c] = line;
    if(board[a] && board[a] === board[b] && board[a] === board[c])
      return { player: board[a], line };
  }
  return null;
}

// ── Orbit Controls (manual) ──────────────────────────────────────────────────
let isDragging = false, prevMouse = { x:0, y:0 };
let spherical = { theta: -0.5, phi: 1.0, r: 10 };

function updateCamera() {
  camera.position.x = spherical.r * Math.sin(spherical.phi) * Math.sin(spherical.theta);
  camera.position.y = spherical.r * Math.cos(spherical.phi);
  camera.position.z = spherical.r * Math.sin(spherical.phi) * Math.cos(spherical.theta);
  camera.lookAt(0, 0, 0);
}
updateCamera();

window.addEventListener('mousedown', e => { isDragging = true; prevMouse = { x: e.clientX, y: e.clientY }; });
window.addEventListener('mouseup',   e => {
  if(!isDragging) return;
  const dx = Math.abs(e.clientX - prevMouse.x), dy = Math.abs(e.clientY - prevMouse.y);
  isDragging = false;
  if(dx < 3 && dy < 3) onClick(e);
});
window.addEventListener('mousemove', e => {
  onMouseMove(e);
  if(!isDragging) return;
  const dx = e.clientX - prevMouse.x, dy = e.clientY - prevMouse.y;
  spherical.theta -= dx * 0.008;
  spherical.phi = Math.max(0.3, Math.min(Math.PI - 0.3, spherical.phi + dy * 0.008));
  prevMouse = { x: e.clientX, y: e.clientY };
  updateCamera();
});
window.addEventListener('wheel', e => {
  spherical.r = Math.max(5, Math.min(18, spherical.r + e.deltaY * 0.01));
  updateCamera();
});

// Touch
let lastTouch = null;
window.addEventListener('touchstart', e => { lastTouch = { x: e.touches[0].clientX, y: e.touches[0].clientY }; isDragging = true; });
window.addEventListener('touchend', e => {
  if(!isDragging) return;
  const t = e.changedTouches[0];
  const dx = Math.abs(t.clientX - lastTouch.x), dy = Math.abs(t.clientY - lastTouch.y);
  isDragging = false;
  if(dx < 5 && dy < 5) onClick({ clientX: t.clientX, clientY: t.clientY });
});
window.addEventListener('touchmove', e => {
  if(!isDragging) return;
  const t = e.touches[0];
  spherical.theta -= (t.clientX - lastTouch.x) * 0.008;
  spherical.phi = Math.max(0.3, Math.min(Math.PI - 0.3, spherical.phi + (t.clientY - lastTouch.y) * 0.008));
  lastTouch = { x: t.clientX, y: t.clientY };
  updateCamera();
  e.preventDefault();
}, { passive: false });

// ── UI ───────────────────────────────────────────────────────────────────────
function setStatus(html) { document.getElementById('status').innerHTML = html; }
function updateScore() {
  document.getElementById('sX').textContent = scores.X;
  document.getElementById('sO').textContent = scores.O;
  document.getElementById('sD').textContent = scores.draw;
}
function newGame() {
  board = Array(27).fill(null);
  currentPlayer = 'X';
  gameOver = false;
  ptW.intensity = 0;
  popQueue = [];
  buildBoard();
  setStatus(`Player <span class="x-col">X</span>'s turn`);
}

// ── Render Loop ──────────────────────────────────────────────────────────────
let t = 0;
function animate() {
  requestAnimationFrame(animate);
  t += 0.01;

  // Hover highlight
  if(!isDragging) {
    raycaster.setFromCamera(mouse, camera);
    const hits = raycaster.intersectObjects(cellMeshes);
    if(hoveredCell && !hoveredCell.userData.taken) {
      hoveredCell.material.emissive?.setHex(0x000000);
      hoveredCell.scale.setScalar(1);
    }
    hoveredCell = null;
    if(hits.length && !gameOver) {
      const c = hits[0].object;
      if(!c.userData.taken) {
        c.material.emissive?.setHex(0x222244);
        c.scale.setScalar(1.05);
        hoveredCell = c;
      }
    }
  }

  // Pop animations
  popQueue = popQueue.filter(p => {
    p.t += 0.08;
    const s = p.t < 0.5 ? p.t * 2 : 1 + Math.sin((p.t - 0.5) * Math.PI) * 0.15 * (1 - p.t);
    p.mesh.scale.setScalar(Math.max(0.01, Math.min(1.15, s)));
    return p.t < 1.5;
  });

  // Win pulse
  if(winMeshes.length) {
    winMeshes.forEach(m => {
      m.material.emissive?.setHex(
        new THREE.Color().setHSL(0.8, 0.8, 0.3 + 0.2 * Math.sin(t * 3)).getHex()
      );
    });
    ptW.intensity = 2 + Math.sin(t * 4) * 1.5;
  }

  // Gentle auto-rotation when idle
  if(!isDragging && !gameOver) {
    spherical.theta += 0.002;
    updateCamera();
  }

  renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

makeGridLines();
newGame();
animate();
</script>
</body>
</html>
