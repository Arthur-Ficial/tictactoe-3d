<style>
  :root{
    --c-player:#00ffff;--c-cpu:#ffff00;--c-win:#ff00ff;--c-bg:#000;
    --c-white:#fff;--c-sep:#333;--c-muted:#555;--c-dim:#444;
    --c-panel:#111;--c-subtle:#aaa;
    --c-player-dim:#00ffff99;--c-cpu-dim:#ffff0099;
    --c-glow-03:rgba(255,255,255,0.03);--c-glow-05:rgba(255,255,255,0.05);
    --c-glow-08:rgba(255,255,255,0.08);--c-glow-15:rgba(255,255,255,0.15);
    --c-glow-20:rgba(255,255,255,0.2);--c-glow-30:rgba(255,255,255,0.3);
    --c-glow-50:rgba(255,255,255,0.5);
    --c-hint:rgba(255,255,255,0.85);--c-hint-shadow:rgba(255,255,255,0.15);
    --c-transparent:rgba(255,255,255,0);
  }
  *{margin:0;padding:0;box-sizing:border-box;
    -webkit-touch-callout:none;
    -webkit-tap-highlight-color:transparent;
    -webkit-user-select:none;user-select:none;
  }
  body{background:var(--c-bg);overflow:hidden;font-family:'Segoe UI',sans-serif;
    touch-action:none;
    overscroll-behavior:none;
    position:fixed;width:100%;height:100%;
  }
  canvas{display:block;touch-action:none;}

  #ui{
    position:fixed;top:0;left:0;right:0;
    display:flex;flex-direction:column;align-items:center;
    pointer-events:none;padding-top:max(12px, env(safe-area-inset-top));gap:4px;
  }

  /* Score bar */
  #score-bar{
    display:flex;align-items:center;gap:0;
    font-size:1.8rem;font-weight:900;letter-spacing:1px;
    width:320px;
  }
  .sc-you{
    flex:1;text-align:left;
    color:var(--c-player);text-shadow:0 0 20px var(--c-player);
  }
  .sc-cpu{
    flex:1;text-align:right;
    color:var(--c-cpu);text-shadow:0 0 20px var(--c-cpu);
  }
  .sc-sep{color:var(--c-sep);font-size:1rem;text-align:center;flex:0 0 50px;transition:all 0.3s ease;}
  .sc-sep.timer-active{font-size:0.7rem;color:var(--c-muted);letter-spacing:1px;}

  /* Delta bar */
  #delta-wrap{
    width:320px;height:8px;
    background:var(--c-panel);border-radius:4px;overflow:hidden;
    display:flex;
  }
  #delta-you{background:var(--c-player);height:100%;transition:width 0.4s ease;}
  #delta-cpu{background:var(--c-cpu);height:100%;transition:width 0.4s ease;}

  /* Status */
  #status{
    font-size:1rem;font-weight:800;letter-spacing:3px;
    color:var(--c-white);text-shadow:0 0 12px var(--c-white);
    min-height:1.3rem;text-align:center;
  }
  .x-col{color:var(--c-player);text-shadow:0 0 15px var(--c-player),0 0 40px var(--c-player);}
  .o-col{color:var(--c-cpu);text-shadow:0 0 15px var(--c-cpu),0 0 40px var(--c-cpu);}
  .w-col{color:var(--c-win);text-shadow:0 0 25px var(--c-win),0 0 60px var(--c-win);}

  /* Threat preview bar */
  #threat-bar{
    font-size:0.65rem;letter-spacing:2px;color:var(--c-dim);
    min-height:0.9rem;text-align:center;
  }
  .tx{color:var(--c-player-dim);} .to{color:var(--c-cpu-dim);}

  #bottom{
    position:fixed;bottom:max(14px, env(safe-area-inset-bottom));left:0;right:0;
    display:flex;flex-direction:column;align-items:center;gap:7px;
    pointer-events:none;
  }
  #newgame-btn{
    position:fixed;
    bottom:calc(max(14px, env(safe-area-inset-bottom)) + 44px);
    left:50%;transform:translateX(-50%);
    padding:0.5rem 2rem;border:2px solid transparent;
    background:var(--c-glow-03);color:var(--c-muted);
    opacity:0;pointer-events:none;
    border-radius:6px;font-size:0.85rem;font-weight:900;
    letter-spacing:3px;cursor:pointer;white-space:nowrap;
    text-shadow:none;
    box-shadow:none;
    transition:all 0.15s;
    z-index:10;
  }
  #newgame-btn.game-over{
    color:var(--c-white);border:2px solid var(--c-white);
    background:var(--c-glow-08);
    text-shadow:0 0 8px var(--c-white);
    box-shadow:0 0 15px var(--c-glow-30);
  }
  #newgame-btn:hover{background:var(--c-glow-20);box-shadow:0 0 28px var(--c-glow-50);}

  #share-btn{
    position:fixed;
    bottom:max(14px, env(safe-area-inset-bottom));
    left:50%;transform:translateX(-50%);
    padding:0.4rem 1.6rem;border:2px solid transparent;
    background:var(--c-glow-03);color:var(--c-muted);
    opacity:0;pointer-events:none;
    border-radius:6px;font-size:0.72rem;font-weight:900;
    letter-spacing:3px;cursor:pointer;white-space:nowrap;
    text-shadow:none;box-shadow:none;
    transition:all 0.15s;
    z-index:10;
  }
  #share-btn.visible{
    opacity:1;pointer-events:all;
    color:var(--c-subtle);border:2px solid var(--c-muted);
    background:var(--c-glow-05);
  }
  #share-btn:hover{background:var(--c-glow-15);box-shadow:0 0 20px var(--c-glow-30);color:var(--c-white);border-color:var(--c-white);}
  #hint{
    pointer-events:none;
    width:100%;text-align:center;
    text-transform:uppercase;
    font-weight:300;
    perspective:600px;
    transition:opacity 1.2s cubic-bezier(0.4,0,0.2,1),
               transform 1.2s cubic-bezier(0.4,0,0.2,1),
               filter 1.2s cubic-bezier(0.4,0,0.2,1),
               color 0.8s cubic-bezier(0.25,0.8,0.25,1),
               font-size 0.8s cubic-bezier(0.25,0.8,0.25,1),
               text-shadow 0.8s cubic-bezier(0.25,0.8,0.25,1),
               letter-spacing 0.8s cubic-bezier(0.25,0.8,0.25,1);
    transform-style:preserve-3d;
  }
  #hint.hint-big{
    color:var(--c-hint);
    font-size:0.72rem;
    letter-spacing:0.28em;
    text-shadow:0 0 20px var(--c-hint-shadow);
    opacity:1;
    transform:perspective(600px) rotateX(0deg) translateY(0) translateZ(0);
    filter:blur(0);
  }
  #hint.hint-hidden{
    color:var(--c-transparent);
    font-size:0.72rem;
    letter-spacing:0.28em;
    text-shadow:none;
    opacity:0;
    transform:perspective(600px) rotateX(-45deg) translateY(-10px) translateZ(-80px);
    filter:blur(6px);
  }

</style>

<body>
<canvas id="canvas"></canvas>

<div id="ui">
  <div id="score-bar">
    <span class="sc-you">YOU <span id="sX">0</span></span>
    <span class="sc-sep" id="sc-sep">|</span>
    <span class="sc-cpu"><span id="sO">0</span> <span id="cpu-label">CPU</span></span>
  </div>
  <div id="delta-wrap">
    <div id="delta-you" style="width:50%"></div>
    <div id="delta-cpu" style="width:50%"></div>
  </div>
  <div id="status"></div>
  <div id="threat-bar"></div>
</div>

<div id="bottom">
  <div id="hint"><span id="hint-touch">swipe to spin &nbsp;&middot;&nbsp; double-tap to place &nbsp;&middot;&nbsp; pinch to zoom</span><span id="hint-kb" style="display:none">arrows to rotate &nbsp;&middot;&nbsp; tab to select &nbsp;&middot;&nbsp; enter to place</span></div>
</div>
<button id="newgame-btn" onclick="newGame()">NEW GAME</button>
<button id="share-btn" onclick="shareGame()">SHARE</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="js/cpu-normal.js?v=b3c365b"></script>
<script src="js/cpu-super-hard.js?v=b3c365b"></script>
<script>
// ═══════════════════════════════════════════════════════════════════
// COLOR PALETTE — Single Source of Truth for all JS colors
// ═══════════════════════════════════════════════════════════════════
const C = {
  PLAYER:       0x00ffff, PLAYER_EM: 0x007777, PLAYER_MK_EM: 0x004466,
  CPU:          0xff6600, CPU_EM:    0xaa3300, CPU_MK_EM:    0x993300, CPU_SPEC: 0xffcc88,
  CPU_LINE:     0xffff00,
  WIN:          0xff00ff,
  CELL:         0x0e1133, CELL_SPEC: 0x4466cc, CELL_EDGE: 0x4477dd,
  HOVER:        0x221144, HOVER_SPEC: 0xaa66ff, HOVER_EM: 0x110033, HOVER_RESET: 0x000011,
  WHITE:        0xffffff, BG: 0x000000,
  LP_EDGE_HI:   0x88aaff, LP_EDGE_WF: 0x6699ff,
};
const h = n => '#' + n.toString(16).padStart(6, '0');

// ═══════════════════════════════════════════════════════════════════
// RENDERER
// ═══════════════════════════════════════════════════════════════════
const canvas = document.getElementById('canvas');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true, preserveDrawingBuffer:true});
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setClearColor(C.BG);
renderer.shadowMap.enabled = true;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.1, 200);

// ═══════════════════════════════════════════════════════════════════
// LIGHTS
// ═══════════════════════════════════════════════════════════════════
scene.add(new THREE.AmbientLight(C.WHITE, 0.2));
const sun = new THREE.DirectionalLight(C.WHITE, 2.5);
sun.position.set(10,15,10); sun.castShadow=true; scene.add(sun);
const ptX  = new THREE.PointLight(C.PLAYER, 5, 35); ptX.position.set(-8,4,6);  scene.add(ptX);
const ptO  = new THREE.PointLight(C.CPU, 5, 35); ptO.position.set( 8,4,6);  scene.add(ptO);
const ptW  = new THREE.PointLight(C.WIN, 0, 30); ptW.position.set( 0,8,0);  scene.add(ptW);
const ptAI = new THREE.PointLight(C.CPU_LINE, 0, 20); ptAI.position.set(0,-4,8); scene.add(ptAI);

// ═══════════════════════════════════════════════════════════════════
// CONSTANTS & WIN LINES
// ═══════════════════════════════════════════════════════════════════
const PLAYER='X', CPU='O';
const SP=2.0, CS=1.25;
const CENTER=13; // index of center cell — removed from play

const cellPos = (i) => {
  const x = i%3, y = Math.floor(i/3)%3, z = Math.floor(i/9);
  return new THREE.Vector3((x-1)*SP, (y-1)*SP, (z-1)*SP);
};

// Build all 49 lines in 3x3x3, then filter out any touching center
const I = (x,y,z) => z*9+y*3+x;
const RAW_WINS = (() => {
  const L = [];
  for(let a=0;a<3;a++) for(let b=0;b<3;b++){
    L.push([I(0,a,b),I(1,a,b),I(2,a,b)]);
    L.push([I(a,0,b),I(a,1,b),I(a,2,b)]);
    L.push([I(a,b,0),I(a,b,1),I(a,b,2)]);
  }
  for(let z=0;z<3;z++){
    L.push([I(0,0,z),I(1,1,z),I(2,2,z)]);
    L.push([I(2,0,z),I(1,1,z),I(0,2,z)]);
  }
  for(let x=0;x<3;x++){
    L.push([I(x,0,0),I(x,1,1),I(x,2,2)]);
    L.push([I(x,2,0),I(x,1,1),I(x,0,2)]);
  }
  for(let y=0;y<3;y++){
    L.push([I(0,y,0),I(1,y,1),I(2,y,2)]);
    L.push([I(2,y,0),I(1,y,1),I(0,y,2)]);
  }
  L.push([I(0,0,0),I(1,1,1),I(2,2,2)]);
  L.push([I(2,0,0),I(1,1,1),I(0,2,2)]);
  L.push([I(0,2,0),I(1,1,1),I(2,0,2)]);
  L.push([I(2,2,0),I(1,1,1),I(0,0,2)]);
  return L;
})();
const WINS = RAW_WINS.filter(line => !line.includes(CENTER));
// 36 valid lines

const CPU_DIFFICULTY = {
  NORMAL: 'normal',
  SUPER_HARD: 'super-hard',
};

let cpuDifficulty = CPU_DIFFICULTY.NORMAL;
let cpuRequestId = 0;
let cpuVsCpu = false; // CPU vs CPU spectator mode
let firstMoveCpu = false; // true = CPU goes first
let thinkingTimeSec = 0; // 0 = off (natural delay), 5/10/15 = timer seconds
let countdownInterval = null; // timer interval for countdown display
let countdownStart = 0; // timestamp when countdown started

// ── Cinematic camera for CPU vs CPU ──
let cineCam = null; // {targetTheta, targetPhi, startTheta, startPhi, startTime, duration, onDone}
const superHardCpu = window.TTT3DCPU.createSuperHardSolver({
  wins: WINS,
  center: CENTER,
  player: PLAYER,
  cpu: CPU,
});

// ═══════════════════════════════════════════════════════════════════
// GAME STATE — single source of truth
// ═══════════════════════════════════════════════════════════════════
let board;          // Array(27): null | 'X' | 'O' | '_' (center)
let scores;         // {X, O} — completed lines this game
let gameOver;
let thinking;
let introActive = false;
let introStart = 0;
let moveCount = 0;  // total moves placed this game (player + CPU)
let cpuTimerId = null;

// ─── board helpers ────────────────────────────────────────────────
function isPlayable(b, i) {
  return i !== CENTER && b[i] === null;
}

function getEmpties(b) {
  return b.map((v,i) => isPlayable(b,i) ? i : -1).filter(i => i >= 0);
}

function isFull(b) {
  return b.every((v,i) => i === CENTER || v !== null);
}

// Lines completed by 'who' on board b at cell i (b[i] must already be set)
function newLinesAt(b, i, who) {
  return WINS.filter(line => line.includes(i) && line.every(j => b[j] === who));
}

// Count total completed lines for 'who' on board b
function countCompleted(b, who) {
  return WINS.filter(line => line.every(j => b[j] === who)).length;
}

// ═══════════════════════════════════════════════════════════════════
// THREE.JS SCENE
// ═══════════════════════════════════════════════════════════════════
const pivot = new THREE.Group(); scene.add(pivot);
let cellMeshes = [];         // Array(27), null for CENTER
let lineTubes = [];          // scored line visuals
let partialTubes = [];       // partial-line threat visuals (rebuilt each turn)
let popQueue = [];
let shockQueue = [];

// Deliberately disabled — felt too dominant/distracting. Set to true to re-enable.
const SHOCKWAVE_ENABLED = false;
function spawnShockwave(worldPos, color) {
  if (!SHOCKWAVE_ENABLED) return;
  const geo = new THREE.TorusGeometry(0.8, 0.08, 8, 32);
  const mat = new THREE.MeshBasicMaterial({ color, transparent:true, opacity:0.5 });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.copy(worldPos);
  pivot.add(mesh);
  const glowGeo = new THREE.TorusGeometry(0.8, 0.22, 8, 32);
  const glowMat = new THREE.MeshBasicMaterial({ color, transparent:true, opacity:0.12 });
  const glow = new THREE.Mesh(glowGeo, glowMat);
  glow.position.copy(worldPos);
  pivot.add(glow);
  // Face camera immediately
  const camWorld = camera.getWorldPosition(new THREE.Vector3());
  mesh.lookAt(camWorld);
  glow.lookAt(camWorld);
  shockQueue.push({ mesh, mat, geo, glow, glowMat, glowGeo, t:0 });
}
const sharedGeo = new THREE.BoxGeometry(CS,CS,CS);
const sharedEdgeGeo = new THREE.EdgesGeometry(sharedGeo);

function disposeObject(obj) {
  if (!obj) return;
  const skipGeo = g => g === sharedGeo || g === sharedEdgeGeo;
  obj.traverse(child => {
    if (child.geometry && !skipGeo(child.geometry)) child.geometry.dispose();
    if (child.material && !sharedMats.has(child.material)) child.material.dispose();
  });
  if (obj.geometry && !skipGeo(obj.geometry)) obj.geometry.dispose();
  if (obj.material && !sharedMats.has(obj.material)) obj.material.dispose();
}

// Shared materials (cached singletons — never dispose these)
const matEmpty = new THREE.MeshPhongMaterial({
  color:C.CELL, transparent:true, opacity:0.55, shininess:18, specular:C.CELL_SPEC
});
const matHover = new THREE.MeshPhongMaterial({
  color:C.HOVER, transparent:true, opacity:0.9, shininess:120, specular:C.HOVER_SPEC, emissive:C.HOVER_EM
});
const matX = new THREE.MeshPhongMaterial({
  color:C.PLAYER, emissive:C.PLAYER_EM, shininess:220, specular:C.WHITE
});
const matO = new THREE.MeshPhongMaterial({
  color:C.CPU, emissive:C.CPU_EM, shininess:220, specular:C.CPU_SPEC
});
const sharedMats = new Set([matEmpty, matHover, matX, matO]);

function buildGrid() {
  // Grid framework lines removed — cell edge outlines (EdgesGeometry)
  // provide sufficient spatial structure. Previous grid lines caused
  // z-fighting artifacts on filled cells.
}

function buildBoard() {
  cellMeshes.forEach(m => { if (m) { pivot.remove(m); disposeObject(m); } });
  cellMeshes = [];
  [...lineTubes, ...partialTubes].forEach(o => { pivot.remove(o); disposeObject(o); });
  lineTubes = []; partialTubes = [];
  popQueue = [];

  for(let i=0;i<27;i++){
    if(i === CENTER){ cellMeshes.push(null); continue; }
    const mesh = new THREE.Mesh(sharedGeo, matEmpty);
    mesh.position.copy(cellPos(i));
    mesh.castShadow = true;
    mesh.userData = { index:i };
    mesh.add(new THREE.LineSegments(sharedEdgeGeo, new THREE.LineBasicMaterial({color:C.CELL_EDGE})));
    pivot.add(mesh);
    cellMeshes.push(mesh);
  }
}

function makeX() {
  const g = new THREE.Group();
  const m = new THREE.MeshPhongMaterial({color:C.PLAYER, emissive:C.PLAYER_MK_EM, shininess:200});
  const bar = new THREE.CylinderGeometry(0.1,0.1,1.1,10);
  const b1 = new THREE.Mesh(bar,m); b1.rotation.z= Math.PI/4; g.add(b1);
  const b2 = new THREE.Mesh(bar,m); b2.rotation.z=-Math.PI/4; g.add(b2);
  g.add(new THREE.Mesh(new THREE.SphereGeometry(0.55,10,10),
    new THREE.MeshPhongMaterial({color:C.PLAYER,transparent:true,opacity:0.07,emissive:C.PLAYER})));
  return g;
}
function makeO() {
  const g = new THREE.Group();
  const m = new THREE.MeshPhongMaterial({color:C.CPU, emissive:C.CPU_MK_EM, shininess:200});
  const t = new THREE.Mesh(new THREE.TorusGeometry(0.42,0.11,14,36),m);
  t.rotation.x = Math.PI/2; g.add(t);
  g.add(new THREE.Mesh(new THREE.SphereGeometry(0.55,10,10),
    new THREE.MeshPhongMaterial({color:C.CPU,transparent:true,opacity:0.07,emissive:C.CPU})));
  return g;
}

// Draw a completed line — bold glowing tube
function drawCompletedLine(line, who) {
  const color = who === PLAYER ? C.PLAYER : C.CPU_LINE;
  const pts = line.map(i => cellMeshes[i] ? cellMeshes[i].position.clone() : cellPos(i));
  const dir = pts[2].clone().sub(pts[0]).normalize().multiplyScalar(0.35);
  pts[0].sub(dir); pts[2].add(dir);
  const curve = new THREE.CatmullRomCurve3(pts);

  const tube = new THREE.Mesh(
    new THREE.TubeGeometry(curve,10,0.06,8,false),
    new THREE.MeshBasicMaterial({color, transparent:true, opacity:1.0})
  );
  const glow = new THREE.Mesh(
    new THREE.TubeGeometry(curve,10,0.18,8,false),
    new THREE.MeshBasicMaterial({color, transparent:true, opacity:0.22})
  );
  pivot.add(tube); pivot.add(glow);
  lineTubes.push(tube, glow);
}

// Draw partial-line threats — dim dashed-style tubes for lines with 2-in-a-row
function rebuildPartialTubes() {
  partialTubes.forEach(o => { pivot.remove(o); disposeObject(o); });
  partialTubes = [];

  for(const line of WINS) {
    const xCount = line.filter(i => board[i] === PLAYER).length;
    const oCount = line.filter(i => board[i] === CPU).length;
    const empty  = line.filter(i => board[i] === null).length;

    // Only show lines with exactly 2 of one player and 1 empty (active threats)
    if(empty !== 1) continue;
    let who = null;
    if(xCount === 2 && oCount === 0) who = PLAYER;
    if(oCount === 2 && xCount === 0) who = CPU;
    if(!who) continue;

    const color = who === PLAYER ? C.PLAYER : C.CPU_LINE;
    const pts = line.map(i => cellMeshes[i] ? cellMeshes[i].position.clone() : cellPos(i));
    const curve = new THREE.CatmullRomCurve3(pts);

    // Thin dim tube — threat indicator
    const threat = new THREE.Mesh(
      new THREE.TubeGeometry(curve,8,0.03,6,false),
      new THREE.MeshBasicMaterial({color, transparent:true, opacity:0.35})
    );
    pivot.add(threat);
    partialTubes.push(threat);
  }
}

// ═══════════════════════════════════════════════════════════════════
// GAME LOGIC
// ═══════════════════════════════════════════════════════════════════
function placeMarker(i, who) {
  // Validate
  if(!isPlayable(board, i)) return false;

  board[i] = who;
  moveCount++;
  updateHint();
  if (who === PLAYER && navigator.vibrate) navigator.vibrate(15);

  const mesh = cellMeshes[i];
  mesh.material = who === PLAYER ? matX : matO;
  mesh.userData.taken = true;
  const sym = who === PLAYER ? makeX() : makeO();
  sym.scale.setScalar(0.55);
  mesh.add(sym);
  mesh.scale.setScalar(0.01);
  popQueue.push({mesh, t:0});
  spawnShockwave(mesh.position.clone(), who === PLAYER ? C.PLAYER : C.CPU);

  // Score new lines
  const scored = newLinesAt(board, i, who);
  if(scored.length) {
    scores[who] += scored.length;
    scored.forEach(line => drawCompletedLine(line, who));
    if (who === PLAYER && navigator.vibrate) navigator.vibrate([30, 50, 30]);
  }

  // Rebuild partial threat tubes
  rebuildPartialTubes();

  return true;
}

function updateUI() {
  const x = scores[PLAYER], o = scores[CPU];
  document.getElementById('sX').textContent = x;
  document.getElementById('sO').textContent = o;

  // Delta bar
  const total = x + o || 1;
  const pctX = (x / total * 100).toFixed(1);
  const pctO = (100 - pctX).toFixed(1);
  document.getElementById('delta-you').style.width = pctX + '%';
  document.getElementById('delta-cpu').style.width = pctO + '%';

  document.getElementById('threat-bar').textContent = '';
}

function checkEnd() {
  if(!isFull(board)) return false;
  gameOver = true;
  stopCountdown();
  ptW.intensity = 0;
  const x = scores[PLAYER], o = scores[CPU];
  if(cpuVsCpu) {
    if(x > o)      { setStatus(`<span class="x-col">X WINS  ${x} - ${o}</span>`); ptW.intensity=6; }
    else if(o > x) { setStatus(`<span class="o-col">O WINS  ${o} - ${x}</span>`); }
    else           setStatus(`<span style="color:#fff">DRAW  ${x} - ${o}</span>`);
    // Auto-restart after delay in CPU vs CPU mode
    setTimeout(() => { if(cpuVsCpu) newGame(); }, 4000);
  } else {
    if(x > o)      { setStatus(`<span class="w-col">YOU WIN  ${x} - ${o}</span>`); ptW.intensity=6; if(navigator.vibrate) navigator.vibrate([50,30,50,30,100]); }
    else if(o > x) { setStatus(`<span class="o-col">CPU WINS  ${o} - ${x}</span>`); if(navigator.vibrate) navigator.vibrate([100,50,100]); }
    else           setStatus(`<span style="color:#fff">DRAW  ${x} - ${o}</span>`);
  }
  updateButtonState();
  return true;
}

function playerTurn(i) {
  if(gameOver || thinking || introActive) return;
  if(cpuVsCpu) return; // no player input in CPU vs CPU mode
  if(!isPlayable(board, i)) return;

  placeMarker(i, PLAYER);
  updateUI();
  if(checkEnd()) return;

  scheduleCpuMove(CPU);
}

function startCountdown(delaySec) {
  stopCountdown();
  const sep = document.getElementById('sc-sep');
  if(!sep || delaySec <= 0) return;
  countdownStart = Date.now();
  const totalMs = delaySec * 1000;
  sep.classList.add('timer-active');
  countdownInterval = setInterval(() => {
    const elapsed = Date.now() - countdownStart;
    const remaining = Math.max(0, (totalMs - elapsed) / 1000);
    sep.textContent = remaining.toFixed(1);
    if(remaining <= 0) stopCountdown();
  }, 50);
}

function stopCountdown() {
  if(countdownInterval) { clearInterval(countdownInterval); countdownInterval = null; }
  const sep = document.getElementById('sc-sep');
  if(sep) { sep.textContent = '|'; sep.classList.remove('timer-active'); }
}

// ── Cinematic camera: smoothly orbit to face a cell before placement ──
function cineAngleForCell(cellIdx) {
  const pos = cellPos(cellIdx);
  // Camera goes to same side as the cell so it's in the foreground
  const theta = Math.atan2(pos.x, pos.z);
  // Slight elevation bias toward cell's y position
  const dist = Math.sqrt(pos.x * pos.x + pos.z * pos.z) || 0.001;
  const phi = Math.PI / 2 - Math.atan2(pos.y * 0.5, dist);
  return { theta, phi: Math.max(PHI_MIN + 0.1, Math.min(PHI_MAX - 0.1, phi)) };
}

function shortAngleDist(from, to) {
  const d = ((to - from) % (Math.PI * 2) + Math.PI * 3) % (Math.PI * 2) - Math.PI;
  return d;
}

function startCineMove(cellIdx, duration, onDone) {
  const target = cineAngleForCell(cellIdx);
  cineCam = {
    targetTheta: sph.theta + shortAngleDist(sph.theta, target.theta),
    targetPhi: target.phi,
    startTheta: sph.theta,
    startPhi: sph.phi,
    startTime: Date.now(),
    duration,
    onDone,
  };
}

function updateCineCam() {
  if (!cineCam) return false;
  const elapsed = Date.now() - cineCam.startTime;
  const t = Math.min(1, elapsed / cineCam.duration);
  // Ease-out cubic for smooth deceleration
  const e = 1 - Math.pow(1 - t, 3);
  sph.theta = cineCam.startTheta + (cineCam.targetTheta - cineCam.startTheta) * e;
  sph.phi = cineCam.startPhi + (cineCam.targetPhi - cineCam.startPhi) * e;
  updateCamera();
  if (t >= 1) {
    const done = cineCam.onDone;
    cineCam = null;
    if (done) done();
  }
  return true;
}

function cancelCineCam() { cineCam = null; }

function scheduleCpuMove(who) {
  if(gameOver) return;
  thinking = true;
  ptAI.intensity = 3;
  setStatus(`<span style="color:var(--c-cpu);text-shadow:0 0 15px var(--c-cpu)">CPU THINKING</span>`);

  const useTimer = thinkingTimeSec > 0;
  const requestId = ++cpuRequestId;
  const difficulty = cpuDifficulty;
  const snapshot = [...board];

  if(useTimer) {
    // Timer mode: countdown is a max — CPU can finish faster
    startCountdown(thinkingTimeSec);
    const movePromise = getCpuMove(difficulty, snapshot, who);
    const timerPromise = new Promise(r => { cpuTimerId = setTimeout(r, thinkingTimeSec * 1000); });

    movePromise.then(move => {
      if(requestId !== cpuRequestId) return;
      // Wait for timer OR place immediately — CPU can be faster
      stopCountdown();
      if(cpuTimerId) { clearTimeout(cpuTimerId); cpuTimerId = null; }
      finishCpuMove(requestId, who, move);
    }).catch(err => {
      console.error('CPU move failed:', err);
      if(requestId !== cpuRequestId) return;
      stopCountdown();
      if(cpuTimerId) { clearTimeout(cpuTimerId); cpuTimerId = null; }
      const fb = cpuFallback(snapshot, who);
      finishCpuMove(requestId, who, fb);
    });
  } else {
    // Natural delay mode (original behavior)
    const filled = board.filter((v,i) => i !== CENTER && v !== null).length;
    const base = 600 + filled * 40;
    const jitter = (Math.random() - 0.3) * 500;
    const delay = Math.max(400, Math.min(2200, base + jitter));

    cpuTimerId = setTimeout(async () => {
      cpuTimerId = null;
      try {
        const move = await getCpuMove(difficulty, snapshot, who);
        if(requestId !== cpuRequestId) return;
        finishCpuMove(requestId, who, move);
      } catch(err) {
        console.error('CPU move failed:', err);
        if(requestId !== cpuRequestId) return;
        finishCpuMove(requestId, who, cpuFallback(snapshot, who));
      }
    }, delay);
  }
}

function cpuFallback(snapshot, who) {
  const meAs = who || CPU;
  const oppAs = meAs === CPU ? PLAYER : CPU;
  return window.TTT3DCPU.getNormalCpuMove({
    board: snapshot, wins: WINS, center: CENTER, player: oppAs, cpu: meAs
  });
}

function finishCpuMove(requestId, who, move) {
  if(requestId !== cpuRequestId) return;
  if(move === -1) { completeCpuTurn(requestId, who); return; }

  if(cpuVsCpu) {
    // Cinematic: animate camera to the cell, then place marker
    startCineMove(move, 800, () => {
      if(requestId !== cpuRequestId) return;
      placeMarker(move, who);
      completeCpuTurn(requestId, who);
    });
  } else {
    placeMarker(move, who);
    completeCpuTurn(requestId, who);
  }
}

function completeCpuTurn(requestId, who) {
  if(requestId !== cpuRequestId) return;
  ptAI.intensity = 0;
  thinking = false;
  updateUI();
  if(!checkEnd()) {
    setStatus('');
    if(cpuVsCpu && !gameOver) {
      scheduleCpuMove(who === PLAYER ? CPU : PLAYER);
    }
  }
}

function newGame() {
  cpuRequestId++;
  if (cpuTimerId) { clearTimeout(cpuTimerId); cpuTimerId = null; }
  stopCountdown();
  cancelCineCam();
  lpActive = false; lpLocked = false; lpRestoring = false;
  lpSavedMap = null; lpRestoreSnaps = null; lpStage = 0;
  if (lpInterval) { clearInterval(lpInterval); lpInterval = null; }
  board = Array(27).fill(null);
  board[CENTER] = '_'; // permanently blocked
  scores = {X:0, O:0};
  gameOver = false;
  thinking = false;
  ptW.intensity = 0;
  ptAI.intensity = 0;
  popQueue = [];
  shockQueue.forEach(s => {
    pivot.remove(s.mesh); pivot.remove(s.glow);
    s.geo.dispose(); s.mat.dispose();
    s.glowGeo.dispose(); s.glowMat.dispose();
  });
  shockQueue = [];
  hoveredMesh = null;
  lastClickTime = 0; lastClickIdx = -1;
  lastTap = 0; lastTapIdx = -1; kbHoverIdx = -1;
  moveCount = 0;
  buildBoard();
  updateUI();
  updateHeaderLabels();
  setStatus('');
  // Start intro animation
  introActive = true;
  introStart = Date.now();
  sph.r = 9.5;
  sph.theta = -0.4;
  sph.phi = 1.05;
  vel.theta = 0; vel.phi = 0; vel.r = 0;
  updateCamera();
  lastInteract = Date.now();
  updateButtonState();
  updateHint();

  // Schedule first CPU move after intro animation completes (~2s)
  const introDelay = 2200;
  if(cpuVsCpu) {
    setTimeout(() => { if(!gameOver) scheduleCpuMove(PLAYER); }, introDelay);
  } else if(firstMoveCpu) {
    setTimeout(() => { if(!gameOver) scheduleCpuMove(CPU); }, introDelay);
  }
}

async function getCpuMove(difficulty, snapshot, who) {
  // who = which side is making this move (PLAYER or CPU)
  const meAs = who || CPU;
  const oppAs = meAs === CPU ? PLAYER : CPU;

  if(difficulty === CPU_DIFFICULTY.SUPER_HARD) {
    const result = await superHardCpu.getBestMove(snapshot);
    return result.move;
  }

  return window.TTT3DCPU.getNormalCpuMove({
    board: snapshot,
    wins: WINS,
    center: CENTER,
    player: oppAs,
    cpu: meAs
  });
}

function normalizeDifficulty(mode) {
  return mode === CPU_DIFFICULTY.SUPER_HARD ? CPU_DIFFICULTY.SUPER_HARD : CPU_DIFFICULTY.NORMAL;
}

function updateCpuLabel() {
  const label = document.getElementById('cpu-label');
  if(!label) return;
  label.textContent = cpuDifficulty === CPU_DIFFICULTY.SUPER_HARD ? 'CPU+' : 'CPU';
}

function updateHeaderLabels() {
  const youLabel = document.querySelector('.sc-you');
  if(!youLabel) return;
  const scoreVal = scores[PLAYER];
  const isHard = cpuDifficulty === CPU_DIFFICULTY.SUPER_HARD;
  youLabel.textContent = '';
  youLabel.append(cpuVsCpu ? (isHard ? 'CPU+ ' : 'CPU ') : 'YOU ');
  const span = document.createElement('span');
  span.id = 'sX';
  span.textContent = scoreVal;
  youLabel.appendChild(span);
  updateCpuLabel();
}

// ═══════════════════════════════════════════════════════════════════
// CAMERA ORBIT
// ═══════════════════════════════════════════════════════════════════
let sph = {theta:-0.4, phi:1.05, r:9.5};
// Momentum / inertia state
let vel = {theta:0, phi:0, r:0};
const FRICTION = 0.92;       // per-frame velocity decay for rotation
const ZOOM_FRICTION = 0.85;  // zoom velocity decay
const ZOOM_SPRING = 0.15;    // spring stiffness for zoom bounds
const ZOOM_MIN = 4, ZOOM_MAX = 20;
const PHI_MIN = 0.2, PHI_MAX = Math.PI - 0.2;
let lastDragTime = 0;
let lastDragDelta = {x:0, y:0};
let lastTouchDragDelta = {x:0, y:0};
let lastTouchDragTime = 0;

function updateCamera() {
  camera.position.x = sph.r * Math.sin(sph.phi) * Math.sin(sph.theta);
  camera.position.y = sph.r * Math.cos(sph.phi);
  camera.position.z = sph.r * Math.sin(sph.phi) * Math.cos(sph.theta);
  camera.lookAt(0,0,0);
}
updateCamera();

// ═══════════════════════════════════════════════════════════════════
// INPUT
// ═══════════════════════════════════════════════════════════════════
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();
let hoveredMesh = null, isDragging = false, mouseDown = false, dragStart = {x:0,y:0};
let lastClickTime = 0, lastClickIdx = -1;
let lastInteract = 0;
function touched() {
  lastInteract = Date.now();
  if(!gameOver) showButton(false);
}

function getHit(cx, cy) {
  mouse.x = (cx / window.innerWidth)  * 2 - 1;
  mouse.y = -(cy / window.innerHeight) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);
  const hits = raycaster.intersectObjects(cellMeshes.filter(Boolean));
  return hits.length ? hits[0].object : null;
}

function tryPlace(cx, cy) {
  if(introActive || cpuVsCpu) return;
  const hit = getHit(cx, cy);
  if(!hit || hit.userData.taken || gameOver || thinking) return;
  const i = hit.userData.index;
  const now = Date.now();
  if((now - lastClickTime < 420) && (lastClickIdx === i)) {
    playerTurn(i);
    lastClickTime = 0; lastClickIdx = -1;
  } else {
    lastClickTime = now; lastClickIdx = i;
    const prev = hit.material;
    hit.material = matHover;
    setTimeout(()=>{ if(!hit.userData.taken) hit.material = prev; }, 300);
  }
}

// Mouse
window.addEventListener('mousedown', e => {
  if(introActive) return;
  if(e.target === btn || e.target === shareBtn || e.target.closest('#theme-gear')) return;
  mouseDown=true; isDragging=false; touched();
  dragStart={x:e.clientX,y:e.clientY};
  lastDragDelta={x:0,y:0}; lastDragTime=Date.now();
  vel.theta=0; vel.phi=0; // stop momentum when grabbing
  lpStart(e.clientX, e.clientY);
});
window.addEventListener('mousemove', e => {
  if(introActive) return;
  if(mouseDown) {
    lpCheckMove(e.clientX, e.clientY);
    const dx=e.clientX-dragStart.x, dy=e.clientY-dragStart.y;
    if(Math.hypot(dx,dy)>5) {
      if(lpActive && !lpLocked && lpStage === 0) lpEnd();
      isDragging=true; touched(); canvas.style.cursor='grabbing';
      if(hoveredMesh && !hoveredMesh.userData.taken) {
        hoveredMesh.material.emissive?.setHex(C.HOVER_RESET); hoveredMesh.scale.setScalar(1);
      }
      hoveredMesh=null;
      const mdx=e.clientX-dragStart.x, mdy=e.clientY-dragStart.y;
      sph.theta -= mdx*0.006;
      sph.phi = Math.max(PHI_MIN, Math.min(PHI_MAX, sph.phi+mdy*0.006));
      lastDragDelta={x:mdx,y:mdy}; lastDragTime=Date.now();
      dragStart = {x:e.clientX,y:e.clientY};
      updateCamera();
    }
  }
  if(!isDragging) {
    const hit = getHit(e.clientX, e.clientY);
    if(hoveredMesh && !hoveredMesh.userData.taken) {
      hoveredMesh.material.emissive?.setHex(C.HOVER_RESET); hoveredMesh.scale.setScalar(1);
    }
    hoveredMesh = null;
    if(hit && !hit.userData.taken && !gameOver && !thinking) {
      hit.material.emissive?.setHex(C.HOVER); hit.scale.setScalar(1.08); hoveredMesh=hit;
    }
  }
});
window.addEventListener('mouseup', e => {
  if(introActive) return; touched();
  lpEnd();
  if(!isDragging) tryPlace(e.clientX,e.clientY);
  else {
    // Launch with momentum if drag was recent enough
    const dt = Date.now()-lastDragTime;
    if(dt<80) {
      vel.theta = -lastDragDelta.x*0.006;
      vel.phi   =  lastDragDelta.y*0.006;
    }
  }
  isDragging=false; mouseDown=false; canvas.style.cursor='';
});
window.addEventListener('wheel', e => {
  if(introActive) return;
  touched();
  vel.r += e.deltaY*0.015; // accumulate zoom velocity for springy feel
}, {passive:true});

// Touch
let touches={}, pinchPrevDist=null, pinchActive=false, tDragStart=null;
let lastTap=0, lastTapIdx=-1;
let touchMoved=false;

// Helper: get array of current touch positions from e.touches (always fresh)
function getTouchArr(e) {
  const arr=[];
  for(let i=0;i<e.touches.length;i++) arr.push(e.touches[i]);
  return arr;
}

canvas.addEventListener('touchstart', e => {
  e.preventDefault(); if(introActive) return; touched();
  touchMoved=false;
  vel.theta=0; vel.phi=0; vel.r=0; // stop all momentum when touching
  Array.from(e.changedTouches).forEach(t=>touches[t.identifier]=t);
  const tArr=getTouchArr(e);
  if(tArr.length===2) {
    pinchPrevDist=Math.hypot(tArr[0].clientX-tArr[1].clientX,tArr[0].clientY-tArr[1].clientY);
    pinchActive=true;
    tDragStart={x:(tArr[0].clientX+tArr[1].clientX)/2,y:(tArr[0].clientY+tArr[1].clientY)/2};
  } else if(tArr.length===1) {
    tDragStart={x:tArr[0].clientX,y:tArr[0].clientY};
    lastTouchDragDelta={x:0,y:0}; lastTouchDragTime=Date.now();
    lpStart(tArr[0].clientX, tArr[0].clientY);
  }
},{passive:false});
canvas.addEventListener('touchmove', e => {
  e.preventDefault(); if(introActive) return; touched();
  touchMoved=true;
  Array.from(e.changedTouches).forEach(t=>touches[t.identifier]=t);
  const tArr=getTouchArr(e);
  if(tArr.length===1) lpCheckMove(tArr[0].clientX, tArr[0].clientY);
  if(tArr.length>=2 && lpActive) lpEnd();
  if(tArr.length===2 && pinchActive) {
    const d=Math.hypot(tArr[0].clientX-tArr[1].clientX,tArr[0].clientY-tArr[1].clientY);
    if(pinchPrevDist!==null && pinchPrevDist>0) {
      // Incremental zoom: scale by ratio of current to previous distance
      const ratio=pinchPrevDist/d;
      sph.r=Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, sph.r*ratio));
    }
    pinchPrevDist=d;
    const cx=(tArr[0].clientX+tArr[1].clientX)/2, cy=(tArr[0].clientY+tArr[1].clientY)/2;
    if(tDragStart){
      const dx=cx-tDragStart.x, dy=cy-tDragStart.y;
      sph.theta-=dx*0.005;
      sph.phi=Math.max(PHI_MIN-0.1, Math.min(PHI_MAX+0.1, sph.phi+dy*0.005));
    }
    tDragStart={x:cx,y:cy}; updateCamera();
  } else if(tArr.length===1 && tDragStart) {
    const tc=tArr[0];
    const dx=tc.clientX-tDragStart.x, dy=tc.clientY-tDragStart.y;
    sph.theta-=dx*0.006;
    sph.phi=Math.max(PHI_MIN-0.1, Math.min(PHI_MAX+0.1, sph.phi+dy*0.006));
    lastTouchDragDelta={x:dx,y:dy}; lastTouchDragTime=Date.now();
    tDragStart={x:tc.clientX,y:tc.clientY}; updateCamera();
  }
},{passive:false});
canvas.addEventListener('touchend', e => {
  e.preventDefault(); if(introActive) return; touched();
  lpEnd();
  const ended=Array.from(e.changedTouches);
  // Use ended touch coords for tap detection before pruning
  const endedTouch = ended[0];
  // Prune ended touches BEFORE building remaining set
  ended.forEach(t=>delete touches[t.identifier]);
  const remaining=Object.keys(touches).length;
  if(remaining===0 && ended.length===1 && !pinchActive) {
    // Launch momentum on swipe release
    if(touchMoved) {
      const dt=Date.now()-lastTouchDragTime;
      if(dt<80) {
        vel.theta=-lastTouchDragDelta.x*0.006;
        vel.phi=lastTouchDragDelta.y*0.006;
      }
    }
    // Tap detection (only if finger didn't move much)
    if(!touchMoved || Math.hypot(lastTouchDragDelta.x,lastTouchDragDelta.y)<8) {
      const hit=getHit(endedTouch.clientX,endedTouch.clientY);
      if(hit && !hit.userData.taken && !gameOver && !thinking) {
        const i=hit.userData.index, now=Date.now();
        if((now-lastTap<420) && lastTapIdx===i) {
          playerTurn(i); lastTap=0; lastTapIdx=-1;
        } else { lastTap=now; lastTapIdx=i; hit.material.emissive?.setHex(C.HOVER); }
      }
    }
  }
  if(remaining<2) { pinchPrevDist=null; pinchActive=false; }
},{passive:false});

// ═══════════════════════════════════════════════════════════════════
// KEYBOARD CONTROLS
// ═══════════════════════════════════════════════════════════════════
let kbHoverIdx = -1;
let kbHintsShown = false;

function showKbHints() {
  if (kbHintsShown) return;
  kbHintsShown = true;
  document.getElementById('hint-touch').style.display = 'none';
  document.getElementById('hint-kb').style.display = '';
}

function cycleHover(reverse) {
  if (gameOver || thinking || cpuVsCpu) return;
  const empties = getEmpties(board);
  if (!empties.length) return;
  const cur = kbHoverIdx;
  let idx;
  if (cur < 0) {
    idx = 0;
  } else {
    const pos = empties.indexOf(cur);
    idx = pos < 0 ? 0 : (reverse ? (pos - 1 + empties.length) % empties.length : (pos + 1) % empties.length);
  }
  clearKbHover();
  kbHoverIdx = empties[idx];
  const mesh = cellMeshes[kbHoverIdx];
  if (mesh && !mesh.userData.taken) {
    mesh.material = matHover;
    mesh.scale.setScalar(1.08);
    hoveredMesh = mesh;
  }
}

function clearKbHover() {
  if (kbHoverIdx >= 0) {
    const mesh = cellMeshes[kbHoverIdx];
    if (mesh && !mesh.userData.taken) {
      mesh.material = matEmpty;
      mesh.scale.setScalar(1);
    }
  }
  kbHoverIdx = -1;
  hoveredMesh = null;
}

function placeHovered() {
  if (kbHoverIdx < 0 || gameOver || thinking) return;
  const idx = kbHoverIdx;
  clearKbHover();
  playerTurn(idx);
}

window.addEventListener('keydown', e => {
  if (introActive) return;
  touched();
  showKbHints();
  const step = 0.15;
  switch(e.key) {
    case 'ArrowLeft':  sph.theta += step; updateCamera(); break;
    case 'ArrowRight': sph.theta -= step; updateCamera(); break;
    case 'ArrowUp':    sph.phi = Math.max(PHI_MIN, sph.phi - step); updateCamera(); break;
    case 'ArrowDown':  sph.phi = Math.min(PHI_MAX, sph.phi + step); updateCamera(); break;
    case '+': case '=': sph.r = Math.max(ZOOM_MIN, sph.r - 1); updateCamera(); break;
    case '-':           sph.r = Math.min(ZOOM_MAX, sph.r + 1); updateCamera(); break;
    case 'Tab':        e.preventDefault(); cycleHover(e.shiftKey); break;
    case 'Enter': case ' ': e.preventDefault(); placeHovered(); break;
    case 'r': case 'n': if (!thinking) newGame(); break;
    case 'Escape':     clearKbHover(); break;
  }
});

// ═══════════════════════════════════════════════════════════════════
// LONG-PRESS VISUAL MODES
// ═══════════════════════════════════════════════════════════════════
let lpActive = false, lpStage = 0, lpStartTime = 0;
let lpStartPos = {x:0, y:0};
let lpInterval = null;
let lpLocked = false;         // true once user moves while in a visual mode
let lpSavedMap = null;       // Map<material, saved props>
let lpRestoring = false, lpRestoreStart = 0;
let lpRestoreSnaps = null;   // Map<material, {from, to}> for lerp

function lpSaveMat(map, mat) {
  if (map.has(mat)) return;
  map.set(mat, {
    color: mat.color.getHex(),
    emissive: mat.emissive ? mat.emissive.getHex() : null,
    opacity: mat.opacity !== undefined ? mat.opacity : 1,
    transparent: !!mat.transparent,
    visible: mat.visible !== false
  });
}

function lpCollectMaterials() {
  const map = new Map();
  for (const mesh of cellMeshes) {
    if (!mesh) continue;
    lpSaveMat(map, mesh.material);
    for (const child of mesh.children) {
      if (child.isLineSegments) lpSaveMat(map, child.material);
      if (child.isGroup) child.traverse(c => { if (c.material) lpSaveMat(map, c.material); });
    }
  }
  for (const tube of [...lineTubes, ...partialTubes]) {
    lpSaveMat(map, tube.material);
  }
  return map;
}

function lpBoostEmissive(mat, saved) {
  if (!mat.emissive) return;
  const base = saved.emissive || 0;
  const r = Math.min(1, ((base >> 16) & 0xff) / 255 + 0.35);
  const g = Math.min(1, ((base >> 8) & 0xff) / 255 + 0.35);
  const b = Math.min(1, (base & 0xff) / 255 + 0.35);
  mat.emissive.setRGB(r, g, b);
}

function lpApplyStage(stage) {
  if (stage === lpStage) return;
  if (!lpSavedMap) {
    lpSavedMap = lpCollectMaterials();
  }
  lpStage = stage;

  for (const mesh of cellMeshes) {
    if (!mesh) continue;
    const mat = mesh.material;
    const saved = lpSavedMap.get(mat);
    if (!saved) continue;

    if (stage === 1) {
      // HIGH CONTRAST: boost emissive, fully opaque
      lpBoostEmissive(mat, saved);
      mat.opacity = 1;
      mat.transparent = false;
    } else if (stage >= 2) {
      // WIREFRAME / BW WIREFRAME: hide cube faces
      mat.opacity = 0;
      mat.transparent = true;
    }

    for (const child of mesh.children) {
      if (child.isLineSegments) {
        const eMat = child.material;
        if (stage === 1) eMat.color.setHex(C.LP_EDGE_HI);
        else if (stage === 2) eMat.color.setHex(C.LP_EDGE_WF);
      }
      if (child.isGroup) {
        child.traverse(c => {
          if (!c.material) return;
          const ms = lpSavedMap.get(c.material);
          if (!ms) return;
          if (stage === 1) {
            lpBoostEmissive(c.material, ms);
          } else if (stage === 2) {
            // markers stay visible in wireframe
          }
        });
      }
    }
  }

  // Hide line tubes and threat tubes in grid views
  for (const tube of [...lineTubes, ...partialTubes]) {
    tube.material.opacity = 0;
    tube.material.transparent = true;
  }
}


function lpSnapCurrent(mat) {
  return {
    color: mat.color.getHex(),
    emissive: mat.emissive ? mat.emissive.getHex() : null,
    opacity: mat.opacity !== undefined ? mat.opacity : 1
  };
}

function lpStartRestore() {
  if (!lpSavedMap) { lpStage = 0; return; }
  // Snapshot current state for lerp
  lpRestoreSnaps = new Map();
  for (const [mat, saved] of lpSavedMap) {
    lpRestoreSnaps.set(mat, lpSnapCurrent(mat));
  }
  lpRestoring = true;
  lpRestoreStart = Date.now();
}

function lpUpdateRestore() {
  if (!lpRestoring) return;
  const progress = Math.min(1, (Date.now() - lpRestoreStart) / 600);
  const ease = 1 - Math.pow(1 - progress, 2);

  for (const [mat, saved] of lpSavedMap) {
    const from = lpRestoreSnaps.get(mat);
    if (!from) continue;

    // Lerp color
    const fc = new THREE.Color(from.color);
    const tc = new THREE.Color(saved.color);
    mat.color.copy(fc.lerp(tc, ease));

    // Lerp emissive
    if (mat.emissive && saved.emissive !== null && from.emissive !== null) {
      const fe = new THREE.Color(from.emissive);
      const te = new THREE.Color(saved.emissive);
      mat.emissive.copy(fe.lerp(te, ease));
    }

    // Lerp opacity
    mat.opacity = from.opacity + (saved.opacity - from.opacity) * ease;
    mat.transparent = mat.opacity < 1;
  }

  if (progress >= 1) {
    // Snap to exact saved values
    for (const [mat, saved] of lpSavedMap) {
      mat.color.setHex(saved.color);
      if (mat.emissive && saved.emissive !== null) mat.emissive.setHex(saved.emissive);
      mat.opacity = saved.opacity;
      mat.transparent = saved.transparent;
      mat.visible = saved.visible;
    }
    lpRestoring = false;
    lpSavedMap = null;
    lpRestoreSnaps = null;
    lpStage = 0;
  }
}

function lpStart(x, y) {
  if (lpRestoring) return; // don't restart during restore
  if (lpInterval) { clearInterval(lpInterval); lpInterval = null; }
  lpStartTime = Date.now();
  lpStartPos = {x, y};
  lpActive = true;
  lpLocked = false;
  lpStage = 0;
  lpInterval = setInterval(() => {
    if (!lpActive) { clearInterval(lpInterval); lpInterval = null; return; }
    const elapsed = Date.now() - lpStartTime;
    if (elapsed >= 2100 && lpStage < 2) lpApplyStage(2);
    else if (elapsed >= 700 && lpStage < 1) lpApplyStage(1);
  }, 50);
}

function lpEnd() {
  if (!lpActive && !lpLocked) return;
  lpActive = false;
  lpLocked = false;
  if (lpInterval) { clearInterval(lpInterval); lpInterval = null; }
  if (lpStage > 0) lpStartRestore();
}

function lpCheckMove(x, y) {
  if (!lpActive) return;
  if (Math.hypot(x - lpStartPos.x, y - lpStartPos.y) > 8) {
    if (lpStage > 0) {
      // Lock the current visual mode and stop progressing to further stages
      lpLocked = true;
      if (lpInterval) { clearInterval(lpInterval); lpInterval = null; }
    } else {
      lpEnd(); // no mode yet, cancel normally
    }
  }
}

// ═══════════════════════════════════════════════════════════════════
// SHARE
// ═══════════════════════════════════════════════════════════════════
const shareBtn = document.getElementById('share-btn');
function showShareButton(show) {
  shareBtn.classList.toggle('visible', show);
}
function shareGame() {
  renderer.render(scene, camera);
  const w = canvas.width, cH = canvas.height;
  const comp = document.createElement('canvas');
  comp.width = w; comp.height = cH;
  const ctx = comp.getContext('2d');
  ctx.drawImage(canvas, 0, 0);
  const x = scores[PLAYER], o = scores[CPU];
  let resultText, resultColor, shareText;
  if(x > o)      { resultText = `YOU WIN ${x} - ${o}`; resultColor = h(C.WIN); shareText = `I just won ${x} to ${o}!`; }
  else if(o > x) { resultText = `CPU WINS ${o} - ${x}`; resultColor = h(C.CPU); shareText = `I just lost ${o} to ${x}!`; }
  else           { resultText = `DRAW ${x} - ${o}`; resultColor = h(C.WHITE); shareText = `I just drew ${x} to ${o}!`; }
  shareText += ' 3D Tic-Tac-Toe — More Challenging Than You Think';
  const fontSize = Math.round(w * 0.04);
  ctx.textAlign = 'center';
  ctx.font = `bold ${fontSize}px 'Segoe UI', sans-serif`;
  ctx.shadowColor = resultColor;
  ctx.shadowBlur = 25;
  ctx.fillStyle = resultColor;
  ctx.fillText(resultText, w / 2, cH * 0.07);
  ctx.shadowBlur = 15;
  ctx.fillText(resultText, w / 2, cH * 0.07);
  ctx.shadowBlur = 0;
  const subSize = Math.round(w * 0.02);
  ctx.font = `bold ${subSize}px 'Segoe UI', sans-serif`;
  ctx.fillStyle = '#555';
  ctx.fillText('3D TIC-TAC-TOE', w / 2, cH * 0.96);
  comp.toBlob(async (blob) => {
    const file = new File([blob], 'tictactoe3d.png', { type: 'image/png' });
    if(navigator.canShare && navigator.canShare({ files: [file] })) {
      try {
        await navigator.share({ title: '3D Tic-Tac-Toe', text: shareText, url: 'https://arthur-ficial.github.io/tictactoe-3d', files: [file] });
      } catch(e) {
        if(e.name !== 'AbortError') downloadShareImage(blob);
      }
    } else {
      downloadShareImage(blob);
    }
  }, 'image/png');
}
function downloadShareImage(blob) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'tictactoe3d.png';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
const hintEl = document.getElementById('hint');
function updateHint() {
  hintEl.classList.remove('hint-big','hint-hidden');
  if(moveCount === 0) hintEl.classList.add('hint-big');
  else hintEl.classList.add('hint-hidden');
}
const btn = document.getElementById('newgame-btn');
function showButton(show) {
  btn.style.opacity = show ? '1' : '0';
  btn.style.pointerEvents = show ? 'all' : 'none';
}
function updateButtonState(){
  btn.classList.toggle('game-over', gameOver);
  if(cpuVsCpu) { showButton(false); showShareButton(false); return; }
  if(gameOver) { showButton(true); showShareButton(true); }
  else { showButton(false); showShareButton(false); }
}
function boardHasMarks() {
  return board && board.some((v,i) => i !== CENTER && v !== null);
}

// ═══════════════════════════════════════════════════════════════════
// RENDER LOOP
// ═══════════════════════════════════════════════════════════════════
let t=0;
function animate() {
  requestAnimationFrame(animate);
  t += 0.013;

  // Pop-in animation
  popQueue = popQueue.filter(p => {
    p.t += 0.056;
    const s = p.t < 0.5 ? p.t*2 : 1+Math.sin((p.t-0.5)*Math.PI)*0.2*(1-Math.min(p.t,1));
    p.mesh.scale.setScalar(Math.max(0.01, Math.min(1.2, s)));
    return p.t < 1.5;
  });

  // 3D shockwave animation (~550ms, ease-out, faces camera)
  const camWorld = camera.getWorldPosition(new THREE.Vector3());
  shockQueue = shockQueue.filter(s => {
    s.t += 0.03;
    const ease = 1 - Math.pow(1 - s.t, 2);
    const scale = 0.2 + ease * 1.5;
    s.mesh.scale.setScalar(scale);
    s.glow.scale.setScalar(scale * 1.2);
    s.mat.opacity = 0.5 * (1 - s.t * s.t);
    s.glowMat.opacity = 0.12 * (1 - s.t * s.t);
    s.mesh.lookAt(camWorld);
    s.glow.lookAt(camWorld);
    if (s.t >= 1.0) {
      pivot.remove(s.mesh); pivot.remove(s.glow);
      s.geo.dispose(); s.mat.dispose();
      s.glowGeo.dispose(); s.glowMat.dispose();
      return false;
    }
    return true;
  });

  // Intro animation — blends seamlessly into idle auto-rotate
  if(introActive) {
    const elapsed = (Date.now() - introStart) / 2000; // 0..1 over 2 seconds
    // Theta = ease-out quadratic (decelerating) + constant baseline.
    // At t=1 ease derivative is 0, so ending speed = baseline = auto-rotate speed.
    const autoSpeed = 0.36; // auto-rotate rad/s (0.006/frame × 60fps)
    const autoContrib = autoSpeed * 2; // baseline contribution over 2s
    const easeContrib = Math.PI * 2 - autoContrib;
    if(elapsed >= 1) {
      introActive = false;
      sph.r = 17;
      sph.phi = 1.05;
      lastInteract = Date.now() - 3001;
      updateCamera();
    } else {
      const e = 1 - Math.pow(1 - elapsed, 2); // quadratic ease-out (gentler decel)
      sph.r = 9.5 + (17 - 9.5) * (1 - Math.pow(1 - elapsed, 3)); // zoom stays cubic
      sph.theta = -0.4 + autoContrib * elapsed + easeContrib * e;
      sph.phi = 1.05;
      updateCamera();
    }
  }

  // Long-press visual mode updates
  lpUpdateRestore();

  if(ptW.intensity > 0) ptW.intensity = 4+Math.sin(t*4)*2;
  if(thinking) ptAI.intensity = 2+Math.sin(t*8)*1.5;

  // ── Physics: momentum & spring ──
  if(!introActive) {
    let needsUpdate = false;

    // Rotation momentum (only when not actively dragging)
    if(!mouseDown && Object.keys(touches).length===0) {
      if(Math.abs(vel.theta)>0.00001 || Math.abs(vel.phi)>0.00001) {
        sph.theta += vel.theta;
        sph.phi   += vel.phi;
        vel.theta *= FRICTION;
        vel.phi   *= FRICTION;
        // Soft bounce at phi limits
        if(sph.phi < PHI_MIN) { sph.phi = PHI_MIN; vel.phi = Math.abs(vel.phi)*0.3; }
        if(sph.phi > PHI_MAX) { sph.phi = PHI_MAX; vel.phi = -Math.abs(vel.phi)*0.3; }
        needsUpdate = true;
        touched(); // keep idle timer alive during momentum
      }
    }

    // Zoom: velocity-based with spring at boundaries (only when not pinching)
    if(!pinchActive) {
      if(Math.abs(vel.r)>0.001) {
        sph.r += vel.r;
        vel.r *= ZOOM_FRICTION;
        needsUpdate = true;
        touched();
      }
      // Spring back if out of bounds
      if(sph.r < ZOOM_MIN) {
        vel.r += (ZOOM_MIN - sph.r) * ZOOM_SPRING;
        needsUpdate = true;
      } else if(sph.r > ZOOM_MAX) {
        vel.r += (ZOOM_MAX - sph.r) * ZOOM_SPRING;
        needsUpdate = true;
      }
    }
    // Spring back phi if out of soft bounds (from touch overshoot)
    if(sph.phi < PHI_MIN && Object.keys(touches).length===0) {
      sph.phi += (PHI_MIN - sph.phi) * 0.15;
      needsUpdate = true;
    }
    if(sph.phi > PHI_MAX && Object.keys(touches).length===0) {
      sph.phi += (PHI_MAX - sph.phi) * 0.15;
      needsUpdate = true;
    }

    if(needsUpdate) updateCamera();
  }

  // Cinematic camera animation (CPU vs CPU)
  const cineActive = updateCineCam();

  // Auto-rotate: gentle drift in CPU vs CPU (when not animating), otherwise after 3s idle
  if(!isDragging && !introActive && !cineActive) {
    const shouldRotate = cpuVsCpu || (!gameOver && !thinking && (Date.now()-lastInteract>3000));
    if(shouldRotate) {
      sph.theta += cpuVsCpu ? 0.003 : 0.006; // slower drift in spectator mode
      updateCamera();
    }
  }

  // Show NEW GAME button after 7s idle if board has marks and game not over (not in CPU vs CPU)
  if(!cpuVsCpu && !gameOver && !introActive && (Date.now()-lastInteract>7000) && boardHasMarks()) {
    showButton(true);
  }

  renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// Prevent native mobile behaviors that break game feel

buildGrid();

// Bridge for ES modules — exposes game internals for theme system
window._game = {
  renderer, C, sun, matX, matO, matEmpty, matHover,
  ptX, ptO, ptW, ptAI,
  get cellMeshes(){return cellMeshes;},
  get board(){return board;},

    cpuDifficulty = normalizeDifficulty(mode);
    updateCpuLabel();
  },
  getCpuVsCpu() { return cpuVsCpu; },
  setCpuVsCpu(on) {
    cpuVsCpu = !!on;
    updateHeaderLabels();
    updateCpuLabel();
    newGame();
  },
  getFirstMoveCpu() { return firstMoveCpu; },
  setFirstMoveCpu(on) {
    firstMoveCpu = !!on;
  },
  getThinkingTime() { return thinkingTimeSec; },
  setThinkingTime(sec) {
    const n = Number(sec);
    thinkingTimeSec = (n === 0 || [5, 10, 15].includes(n)) ? n : 0;
  },
  newGame() { newGame(); },
  rebuildTubes() {
    // Clear existing tubes
    lineTubes.forEach(o => { pivot.remove(o); disposeObject(o); });
    lineTubes = [];
    // Rebuild completed lines from board state
    for(const line of WINS) {
      const v = board[line[0]];
      if(v && v !== '_' && line.every(i => board[i] === v)) {
        drawCompletedLine(line, v);
      }
    }
    // Rebuild partial threat tubes
    rebuildPartialTubes();
  }
};
updateCpuLabel();
window.addEventListener('beforeunload', () => superHardCpu.terminate());
